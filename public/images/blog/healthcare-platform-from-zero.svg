<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="910" viewBox="0 0 1720 910" role="img" aria-labelledby="t d">
  <title id="t">A healthcare platform built from zero</title>
  <desc id="d">Architecture diagram of a healthcare platform: React Native app, Python and FastAPI API and PostgreSQL database on AWS with Terraform, CI/CD pipelines, and how the team grew from one engineer to module owners.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b6e76"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d9e36b"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box { fill: #1a1b1f; stroke: #34363c; stroke-width: 2; }
    .hi { fill: #1d1f16; stroke: #d9e36b; stroke-width: 3; }
    .bt { fill: #f2f2f3; font-size: 27px; font-weight: 600; text-anchor: middle; }
    .bs { fill: #9a9ca3; font-size: 22px; text-anchor: middle; }
    .st { fill: #f2f2f3; font-size: 27px; font-weight: 600; }
    .ss { fill: #9a9ca3; font-size: 22px; }
    .ln { stroke: #6b6e76; stroke-width: 2.5; fill: none; }
    .lbl { font-size: 19px; letter-spacing: 3px; font-weight: 500; }
  </style>

  <rect width="1720" height="910" rx="28" fill="#111214"/>

  <text x="72" y="104" fill="#f5f5f6" font-size="46" font-weight="700">A healthcare platform built from zero</text>
  <text x="72" y="150" fill="#9a9ca3" font-size="25">Healthcare startup · one engineer laid the foundation, then the team grew on top of it</text>

  <!-- Architecture -->
  <rect x="444" y="182" width="1212" height="264" rx="22" fill="none" stroke="#3c3e45" stroke-width="2" stroke-dasharray="10 9"/>
  <text x="482" y="228" fill="#9a9ca3" class="lbl">AWS · INFRASTRUCTURE AS CODE WITH TERRAFORM</text>

  <rect x="72" y="256" width="300" height="130" rx="18" class="box"/>
  <text x="222" y="312" class="bt">Mobile app</text>
  <text x="222" y="348" class="bs">React Native</text>

  <rect x="482" y="256" width="520" height="130" rx="18" class="box"/>
  <text x="742" y="312" class="bt">API</text>
  <text x="742" y="348" class="bs">Python + FastAPI</text>

  <rect x="1098" y="256" width="520" height="130" rx="18" class="box"/>
  <text x="1358" y="312" class="bt">Database</text>
  <text x="1358" y="348" class="bs">PostgreSQL</text>

  <line x1="374" y1="321" x2="478" y2="321" class="ln" marker-end="url(#a)"/>
  <line x1="1004" y1="321" x2="1094" y2="321" class="ln" marker-end="url(#a)"/>

  <rect x="880" y="490" width="340" height="104" rx="18" class="box"/>
  <text x="1050" y="534" class="bt">CI/CD pipelines</text>
  <text x="1050" y="570" class="bs">build and release</text>
  <line x1="1050" y1="488" x2="1050" y2="452" class="ln" marker-end="url(#a)"/>

  <line x1="72" y1="636" x2="1656" y2="636" stroke="#2a2c31" stroke-width="2"/>

  <!-- Team -->
  <text x="72" y="682" fill="#9a9ca3" class="lbl">HOW THE TEAM GREW</text>

  <rect x="72" y="708" width="600" height="132" rx="18" class="hi"/>
  <text x="100" y="754" class="st">1 · Foundation</text>
  <text x="100" y="790" class="ss">I built the frontend, the backend</text>
  <text x="100" y="820" class="ss">and the AWS infrastructure</text>

  <line x1="676" y1="774" x2="786" y2="774" stroke="#d9e36b" stroke-width="2.5" marker-end="url(#h)"/>

  <rect x="790" y="708" width="866" height="132" rx="18" class="box"/>
  <text x="818" y="754" class="st">2 · Scale</text>
  <text x="818" y="790" class="ss">New developers joined, and I guided them</text>
  <text x="818" y="820" class="ss">until each one owned a module</text>

  <text x="1656" y="882" fill="#7d8088" font-size="20" text-anchor="end">luisdelatorre.dev</text>
</svg>
